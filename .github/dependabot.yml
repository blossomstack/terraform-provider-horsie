version: 2
updates:
  # Go module dependencies (terraform-plugin-framework and friends).
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 10
    groups:
      gomod-routine:
        # Group routine minor/patch updates into a single daily PR; majors open
        # individually for review.
        update-types:
          - minor
          - patch

  # Keeps the actions used by ci.yml and release.yml current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "18:00"
      timezone: "America/Vancouver"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns:
          - "*"
